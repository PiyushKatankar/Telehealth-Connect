services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telehealth
      POSTGRES_PASSWORD: telehealth
      POSTGRES_DB: telehealth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telehealth"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: change-me-before-real-use
      DATABASE_URL: postgresql+psycopg2://telehealth:telehealth@db:5432/telehealth
      FLASK_APP: wsgi.py
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Create the schema (or run `flask db upgrade` if you prefer migrations),
    # seed demo doctors/slots once, then start the server.
    command: sh -c "python seed.py && gunicorn -b 0.0.0.0:8000 -w 1 -k eventlet wsgi:app"

volumes:
  pgdata:
